<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  
  <!-- Camera Shutter Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#lensGrad)" stroke-width="28" opacity="0.9" />
  
  <!-- Aperture Lens Center -->
  <circle cx="256" cy="256" r="72" fill="url(#lensGrad)" filter="url(#glow)" />
  
  <!-- Aperture Blades -->
  <path d="M 256 128 L 296 216 L 256 256 Z" fill="#4f46e5" opacity="0.4" />
  <path d="M 384 256 L 296 296 L 256 256 Z" fill="#7c3aed" opacity="0.4" />
  <path d="M 256 384 L 216 296 L 256 256 Z" fill="#06b6d4" opacity="0.4" />
  <path d="M 128 256 L 216 216 L 256 256 Z" fill="#4f46e5" opacity="0.4" />

  <!-- Sparkling Star Top Right -->
  <circle cx="360" cy="152" r="20" fill="#ffffff" />
  <polygon points="360,116 368,144 396,152 368,160 360,188 352,160 324,152 352,144" fill="#ffffff" />
</svg>
